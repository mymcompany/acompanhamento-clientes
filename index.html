<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYM · Painel de Funil</title>
<style>
  :root{
    --bg:#000000;--panel:#0a0f0c;--panel-line:#16241c;
    --green:#00e676;--green-dark:#00a152;--amber:#ffc400;--red:#ff3b52;
    --txt:#e8f5ee;--txt-dim:#7d9a8a;--neutral:#5a6b62;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding:24px;max-width:1100px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .brand .dot{color:var(--green)}
  .brand span.sub{color:var(--txt-dim);font-size:13px;font-weight:500}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  select,input,button{background:var(--panel);color:var(--txt);border:1px solid var(--panel-line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
  select:focus,input:focus{border-color:var(--green-dark)}
  button{cursor:pointer;transition:all .15s}
  button.ghost:hover{border-color:var(--green-dark);color:var(--green)}
  .date-row{display:flex;gap:8px;align-items:center;color:var(--txt-dim);font-size:13px;margin-bottom:22px;flex-wrap:wrap}
  .date-row input[type=date]{color-scheme:dark}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
  .kpi{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:16px 18px}
  .kpi .label{color:var(--txt-dim);font-size:12px;font-weight:600;margin-bottom:6px}
  .kpi .val{font-size:22px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .val.green{color:var(--green)}
  .section-title{font-size:15px;font-weight:700;color:var(--txt-dim);margin:8px 0 18px}

  /* Funil afunilado com chave lateral */
  .funnel{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:32px 24px;margin-bottom:28px}
  .funnel-inner{display:flex;flex-direction:column;align-items:center;gap:0}
  .frow{display:flex;align-items:stretch;width:100%;justify-content:center}
  .bar-col{flex:0 0 620px;max-width:620px;display:flex;justify-content:center}
  .bar{
    background:linear-gradient(180deg,#0b1611,#050a07);
    border:1px solid var(--panel-line);border-top:2px solid var(--green-dark);
    border-radius:8px;padding:15px 26px;display:flex;justify-content:space-between;align-items:center;
    transition:width .3s;
  }
  .bar .name{font-weight:600;font-size:15px;white-space:nowrap}
  .bar .value{font-weight:800;font-size:19px;color:var(--green);margin-left:24px}
  /* coluna lateral da chave */
  .brace-col{flex:0 0 220px;display:flex;align-items:center;padding-left:14px;position:relative}
  .brace-col svg{display:block;flex-shrink:0;height:64px}
  .brace-col .pct{
    font-size:15px;font-weight:800;padding:6px 13px;border-radius:20px;border:1.5px solid;
    min-width:70px;text-align:center;margin-left:10px;
  }
  .brace-col .tlabel{font-size:11px;color:var(--txt-dim);white-space:nowrap;margin-left:10px}
  .pct.neutral{color:var(--neutral);border-color:var(--neutral)}
  .pct.red{color:var(--red);border-color:var(--red);background:rgba(255,59,82,.08)}
  .pct.amber{color:var(--amber);border-color:var(--amber);background:rgba(255,196,0,.08)}
  .pct.greenlight{color:var(--green);border-color:var(--green);background:rgba(0,230,118,.06)}
  .pct.greendeep{color:#fff;border-color:var(--green);background:var(--green-dark)}
  @media(max-width:760px){
    .bar-col{flex:1 1 auto}
    .brace-col{flex:0 0 130px}
    .brace-col .tlabel{display:none}
  }
  .actions{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:24px}
  .actions h2{font-size:16px;font-weight:800;margin-bottom:4px}
  .actions .sub{color:var(--txt-dim);font-size:13px;margin-bottom:18px}
  .action-item{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--panel-line)}
  .action-item:first-of-type{border-top:none}
  .action-item .tag{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;height:fit-content}
  .tag.crit{background:rgba(255,59,82,.12);color:var(--red)}
  .tag.warn{background:rgba(255,196,0,.12);color:var(--amber)}
  .tag.ok{background:rgba(0,230,118,.1);color:var(--green)}
  .action-item .body strong{display:block;margin-bottom:3px;font-size:14px}
  .action-item .body p{color:var(--txt-dim);font-size:13px}
  .empty{color:var(--txt-dim);text-align:center;padding:40px;font-size:14px}
  .loading{color:var(--green);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><h1>MYM<span class="dot">.</span></h1><span class="sub">Painel de Funil</span></div>
  <div class="controls"><select id="clientSelect"></select></div>
</div>
<div class="date-row">
  <span>Período:</span>
  <input type="date" id="dateStart"><span>até</span><input type="date" id="dateEnd">
  <button class="ghost" id="applyDates">Aplicar</button>
  <button class="ghost" id="last30">Últimos 30d</button>
</div>
<div id="content"><div class="empty">Carregando…</div></div>

<script>
let clients=[], parsed=null;

const WANT=['Investimento','Impressões','Cliques','PageView','Initiate Checkout','Payment Info','Purchase','Valor da conversão'];

function parseCSVText(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
    else{if(c==='"')inQ=true;else if(c===','){row.push(field);field='';}
    else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
    else if(c==='\r'){}else field+=c;}}
  if(field.length||row.length){row.push(field);rows.push(row);}return rows;
}
function num(v){if(v==null)return 0;let s=String(v).trim();
  if(s===''||s.includes('#'))return 0;
  s=s.replace(/R\$/g,'').replace(/\s/g,'').replace(/%/g,'').replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);return isNaN(n)?0:n;}
function buildParsed(rows){
  const header=rows[0],dates=[];
  for(let c=2;c<header.length;c++){const d=(header[c]||'').trim();if(d)dates.push({idx:c,label:d});}
  let start=-1,end=rows.length;
  for(let r=0;r<rows.length;r++){const v=(rows[r][0]||'').trim();
    if(v==='GERAL')start=r;else if(v==='META'&&start>=0){end=r;break;}}
  const metrics={};
  for(let r=start;r<end;r++){const name=(rows[r][1]||'').trim();
    if(WANT.includes(name))metrics[name]=dates.map(d=>num(rows[r][d.idx]));}
  return {dates,metrics};
}
function brToDate(s){const[d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d);}
function aggregate(sd,ed){const m=parsed.metrics,ds=parsed.dates,sum={};
  WANT.forEach(k=>sum[k]=0);
  ds.forEach((d,i)=>{const dt=brToDate(d.label);
    if(dt>=sd&&dt<=ed)WANT.forEach(k=>{if(m[k])sum[k]+=m[k][i];});});
  return sum;}
function classifyPvCheckout(p){if(p<5)return'red';if(p<=7)return'greenlight';return'greendeep';}
function classifyCheckoutPayment(p){if(p<40)return'red';if(p<=50)return'amber';return'greenlight';}
function classifyPaymentPurchase(p){if(p<45)return'red';if(p<=55)return'amber';return'greenlight';}
function fmtInt(n){return Math.round(n).toLocaleString('pt-BR');}
function fmtBRL(n){return'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
function pct(a,b){return b>0?(a/b*100):0;}

function render(){
  if(!parsed){return;}
  const sd=brToDate(document.getElementById('dateStart').value.split('-').reverse().join('/'));
  const ed=brToDate(document.getElementById('dateEnd').value.split('-').reverse().join('/'));
  const s=aggregate(sd,ed);
  const invest=s['Investimento'],imp=s['Impressões'],clk=s['Cliques'],pv=s['PageView'],
        ic=s['Initiate Checkout'],pi=s['Payment Info'],pur=s['Purchase'],rev=s['Valor da conversão'];
  const roas=invest>0?rev/invest:0,cac=pur>0?invest/pur:0,ticket=pur>0?rev/pur:0;
  const tImpClk=pct(clk,imp),tClkPv=pct(pv,clk),tPvIc=pct(ic,pv),tIcPi=pct(pi,ic),tPiPur=pct(pur,pi);
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="label">Investimento</div><div class="val">${fmtBRL(invest)}</div></div>
    <div class="kpi"><div class="label">Faturamento</div><div class="val green">${fmtBRL(rev)}</div></div>
    <div class="kpi"><div class="label">ROAS</div><div class="val ${roas>=3?'green':''}">${roas.toFixed(2)}</div></div>
    <div class="kpi"><div class="label">Vendas</div><div class="val">${fmtInt(pur)}</div></div>
    <div class="kpi"><div class="label">CAC</div><div class="val">${fmtBRL(cac)}</div></div>
    <div class="kpi"><div class="label">Ticket médio</div><div class="val">${fmtBRL(ticket)}</div></div></div>`;
  // etapas do funil com largura afunilada (de 100% a ~46%)
  const stages=[
    {n:'Impressões',v:imp},
    {n:'Cliques no link',v:clk},
    {n:'PageView',v:pv},
    {n:'Initiate Checkout',v:ic},
    {n:'Payment Info',v:pi},
    {n:'Purchase',v:pur},
  ];
  // transições entre etapas (índice = da etapa i para i+1)
  const trans=[
    {p:tImpClk,cls:'neutral',l:'Impr → Cliques'},
    {p:tClkPv,cls:'neutral',l:'Cliques → PageView'},
    {p:tPvIc,cls:classifyPvCheckout(tPvIc),l:'PageView → Checkout'},
    {p:tIcPi,cls:classifyCheckoutPayment(tIcPi),l:'Checkout → Payment'},
    {p:tPiPur,cls:classifyPaymentPurchase(tPiPur),l:'Payment → Compra'},
  ];
  const maxW=620, minW=300, n=stages.length;
  // chave SVG vertical que abraça a lateral, com a ponta apontando pra fora
  function braceSVG(color){
    return `<svg width="22" height="104" viewBox="0 0 22 104" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M4 2 C 14 2, 4 46, 20 52 C 4 58, 14 102, 4 102"
        stroke="${color}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  const colorMap={neutral:'#5a6b62',red:'#ff3b52',amber:'#ffc400',greenlight:'#00e676',greendeep:'#00a152'};

  let rows='';
  stages.forEach((st,i)=>{
    const w=Math.round(maxW-(maxW-minW)*(i/(n-1)));
    const t=trans[i];
    rows+=`<div class="frow">
      <div class="bar-col">
        <div class="bar" style="width:${w}px"><span class="name">${st.n}</span><span class="value">${fmtInt(st.v)}</span></div>
      </div>
      <div class="brace-col">
        ${t?braceSVG(colorMap[t.cls])+`<span class="pct ${t.cls}">${fmtPct(t.p)}</span><span class="tlabel">${t.l}</span>`:''}
      </div>
    </div>`;
  });
  const funnel=`<div class="section-title">Funil — jornada completa</div><div class="funnel"><div class="funnel-inner">${rows}</div></div>`;
  document.getElementById('content').innerHTML=kpis+funnel+buildActions({tPvIc,tIcPi,tPiPur,roas,invest});
}
function buildActions(d){
  const items=[];
  if(d.tPvIc<5)items.push(['crit','Gargalo crítico: PageView → Checkout ('+fmtPct(d.tPvIc)+')','Menos de 5% de quem chega na LP inicia o checkout. Revise proposta de valor acima da dobra, prova social, clareza da oferta e velocidade da página. Teste um CTA mais direto e reduza fricção até o botão de compra.']);
  else if(d.tPvIc<=7)items.push(['warn','Atenção: PageView → Checkout ('+fmtPct(d.tPvIc)+')','Está na média. Teste variações de headline e posição do CTA para passar de 7%.']);
  else items.push(['ok','Saudável: PageView → Checkout ('+fmtPct(d.tPvIc)+')','A LP converte bem em início de checkout. Mantenha e escale o tráfego desse público.']);
  if(d.tIcPi<40)items.push(['crit','Gargalo crítico: Checkout → Payment ('+fmtPct(d.tIcPi)+')','Muita gente inicia o checkout e não informa pagamento. Investigue excesso de campos, frete aparecendo tarde, poucos meios de pagamento ou falta de selos de segurança.']);
  else if(d.tIcPi<=50)items.push(['warn','Atenção: Checkout → Payment ('+fmtPct(d.tIcPi)+')','Conversão intermediária. Simplifique o checkout e mostre frete/prazo mais cedo.']);
  else items.push(['ok','Saudável: Checkout → Payment ('+fmtPct(d.tIcPi)+')','Checkout fluindo bem até o pagamento.']);
  if(d.tPiPur<45)items.push(['crit','Gargalo crítico: Payment → Compra ('+fmtPct(d.tPiPur)+')','Cai muita venda na última etapa. Provável recusa de cartão, falta de Pix ou erro de gateway. Ative recuperação (WhatsApp/e-mail) e ofereça Pix como alternativa.']);
  else if(d.tPiPur<=55)items.push(['warn','Atenção: Payment → Compra ('+fmtPct(d.tPiPur)+')','Perda melhorável. Reforce recuperação de checkout e revise aprovação do gateway.']);
  else items.push(['ok','Saudável: Payment → Compra ('+fmtPct(d.tPiPur)+')','Fechamento forte na última etapa.']);
  if(d.roas<3&&d.invest>0)items.push(['warn','ROAS abaixo da meta ('+d.roas.toFixed(2)+' vs 3.0)','Retorno abaixo do alvo. Corrija o pior gargalo do funil antes de aumentar verba — escalar com funil furado amplia a perda.']);
  const rows=items.map(([t,ti,b])=>`<div class="action-item"><span class="tag ${t}">${t==='crit'?'CRÍTICO':t==='warn'?'ATENÇÃO':'OK'}</span><div class="body"><strong>${ti}</strong><p>${b}</p></div></div>`).join('');
  return`<div class="actions"><h2>Plano de ação</h2><div class="sub">Sugestões priorizadas pelo gap da jornada no período selecionado.</div>${rows}</div>`;
}
function toInput(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function setLast30(){if(!parsed||!parsed.dates.length)return;
  const ds=parsed.dates.map(d=>brToDate(d.label)),last=ds[ds.length-1],first=new Date(last);
  first.setDate(first.getDate()-29);
  document.getElementById('dateEnd').value=toInput(last);
  document.getElementById('dateStart').value=toInput(first);}

async function loadClient(c){
  document.getElementById('content').innerHTML='<div class="loading">Carregando dados…</div>';
  try{
    const resp=await fetch('/api/csv?c='+encodeURIComponent(c.slug));
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const text=await resp.text();
    parsed=buildParsed(parseCSVText(text));
    setLast30();render();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">Não foi possível carregar os dados deste cliente.<br><small>'+e.message+'</small></div>';
  }
}
document.getElementById('applyDates').addEventListener('click',render);
document.getElementById('last30').addEventListener('click',()=>{setLast30();render();});
document.getElementById('clientSelect').addEventListener('change',e=>loadClient(clients[+e.target.value]));

async function init(){
  try{
    const r=await fetch('clients.json');
    clients=await r.json();
  }catch(e){clients=[{name:'Kmineral',slug:'kmineral'}];}
  document.getElementById('clientSelect').innerHTML=clients.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('');
  if(clients.length)loadClient(clients[0]);
}
init();
</script>
</body>
</html>
