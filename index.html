<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYM · Painel de Funil</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0a0f0c;
    --panel-line:#16241c;
    --green:#00e676;
    --green-dark:#00a152;
    --green-deep:#0b3d24;
    --amber:#ffc400;
    --red:#ff3b52;
    --txt:#e8f5ee;
    --txt-dim:#7d9a8a;
    --neutral:#5a6b62;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.5;padding:24px;max-width:1100px;margin:0 auto;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .brand .dot{color:var(--green)}
  .brand span.sub{color:var(--txt-dim);font-size:13px;font-weight:500}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  select,input,button{
    background:var(--panel);color:var(--txt);border:1px solid var(--panel-line);
    border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;
  }
  select:focus,input:focus{border-color:var(--green-dark)}
  button{cursor:pointer;transition:all .15s}
  button.primary{background:var(--green);color:#00160b;border-color:var(--green);font-weight:700}
  button.primary:hover{background:var(--green-dark)}
  button.ghost:hover{border-color:var(--green-dark);color:var(--green)}
  .date-row{display:flex;gap:8px;align-items:center;color:var(--txt-dim);font-size:13px}
  .date-row input[type=date]{color-scheme:dark}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
  .kpi{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:16px 18px}
  .kpi .label{color:var(--txt-dim);font-size:12px;font-weight:600;margin-bottom:6px}
  .kpi .val{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .kpi .val.green{color:var(--green)}

  .section-title{font-size:15px;font-weight:700;color:var(--txt-dim);margin:8px 0 18px}

  /* Funnel */
  .funnel{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:28px 24px;margin-bottom:28px}
  .stage-row{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:0}
  .stage{
    background:#050a07;border:1px solid var(--panel-line);border-radius:12px;
    padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
    margin:0 auto;width:100%;max-width:520px;
  }
  .stage .name{font-weight:600;font-size:15px}
  .stage .value{font-weight:800;font-size:18px;color:var(--green)}
  .stage-wrap{grid-column:1 / -1;display:flex;justify-content:center}
  .connector{grid-column:1 / -1;display:flex;justify-content:center;align-items:center;height:56px;position:relative}
  .brace{display:flex;align-items:center;gap:12px}
  .brace .curly{font-size:52px;line-height:0;color:var(--neutral);font-weight:300;transform:scaleY(1.1)}
  .brace .pct{
    font-size:16px;font-weight:800;padding:6px 14px;border-radius:20px;border:1.5px solid;
    min-width:74px;text-align:center;
  }
  .pct.neutral{color:var(--neutral);border-color:var(--neutral)}
  .pct.red{color:var(--red);border-color:var(--red);background:rgba(255,59,82,.08)}
  .pct.amber{color:var(--amber);border-color:var(--amber);background:rgba(255,196,0,.08)}
  .pct.greenlight{color:var(--green);border-color:var(--green);background:rgba(0,230,118,.06)}
  .pct.greendeep{color:#fff;border-color:var(--green);background:var(--green-dark)}
  .brace .transition-label{position:absolute;left:calc(50% + 90px);font-size:11px;color:var(--txt-dim);white-space:nowrap}

  /* Action plan */
  .actions{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:24px}
  .actions h2{font-size:16px;font-weight:800;margin-bottom:4px}
  .actions .sub{color:var(--txt-dim);font-size:13px;margin-bottom:18px}
  .action-item{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--panel-line)}
  .action-item:first-of-type{border-top:none}
  .action-item .tag{
    flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;height:fit-content;
  }
  .tag.crit{background:rgba(255,59,82,.12);color:var(--red)}
  .tag.warn{background:rgba(255,196,0,.12);color:var(--amber)}
  .tag.ok{background:rgba(0,230,118,.1);color:var(--green)}
  .action-item .body strong{display:block;margin-bottom:3px;font-size:14px}
  .action-item .body p{color:var(--txt-dim);font-size:13px}

  .empty{color:var(--txt-dim);text-align:center;padding:40px;font-size:14px}
  .loading{color:var(--green);text-align:center;padding:40px}

  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:26px;width:100%;max-width:440px}
  .modal h3{margin-bottom:18px;font-size:17px}
  .modal label{display:block;font-size:13px;color:var(--txt-dim);margin:12px 0 6px}
  .modal input{width:100%}
  .modal .row{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
  .hint{font-size:11px;color:var(--txt-dim);margin-top:6px;line-height:1.4}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>MYM<span class="dot">.</span></h1>
    <span class="sub">Painel de Funil</span>
  </div>
  <div class="controls">
    <select id="clientSelect"></select>
    <button class="ghost" id="addClientBtn">+ Cliente</button>
  </div>
</div>

<div class="date-row" style="margin-bottom:22px">
  <span>Período:</span>
  <input type="date" id="dateStart">
  <span>até</span>
  <input type="date" id="dateEnd">
  <button class="ghost" id="applyDates">Aplicar</button>
  <button class="ghost" id="last30">Últimos 30d</button>
</div>

<div id="content">
  <div class="empty">Selecione um cliente para ver o funil.</div>
</div>

<!-- Modal cadastro -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Cadastrar cliente</h3>
    <label>Nome do cliente</label>
    <input type="text" id="newName" placeholder="Ex: Kmineral">
    <label>Link CSV publicado do growthpack</label>
    <input type="text" id="newUrl" placeholder="https://docs.google.com/.../pub?...&output=csv">
    <div class="hint">No Google Sheets: Arquivo → Compartilhar → Publicar na web → aba do growthpack → formato CSV. Cole o link aqui.</div>
    <div class="row">
      <button class="ghost" id="cancelAdd">Cancelar</button>
      <button class="primary" id="saveClient">Salvar</button>
    </div>
  </div>
</div>

<script>
// ---------- Estado ----------
const STORE_KEY = 'mym_clients_v1';
let clients = loadClients();
let current = null;
let parsed = null; // {dates:[], metrics:{name:[valsPorDia]}}

function loadClients(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; }
}
function saveClients(){ localStorage.setItem(STORE_KEY, JSON.stringify(clients)); }

// Semente: Kmineral já cadastrado (link publicado)
if(clients.length === 0){
  clients.push({
    name:'Kmineral',
    url:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTFN6m4KtoCqPLwTswWbOlSsYCOctAh4F5tj8fB41Ocgugx8N_IJlZ0fBR1qmoOHL_i3KP5mB_jrRDf/pub?gid=991020848&single=true&output=csv'
  });
  saveClients();
}

// ---------- Parsing CSV ----------
function parseCSVText(text){
  const rows = [];
  let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}

function num(v){
  if(v==null)return 0;
  let s=String(v).trim();
  if(s===''||s.includes('#DIV')||s.includes('#'))return 0;
  s=s.replace(/R\$/g,'').replace(/\s/g,'').replace(/%/g,'');
  // formato BR: 1.234,56 -> remove pontos de milhar, vírgula vira ponto
  s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

// Métricas do bloco GERAL que interessam (por nome exato na coluna 1)
const WANT = ['Investimento','Impressões','Cliques','PageView','Initiate Checkout','Payment Info','Purchase','Valor da conversão'];

function buildParsed(rows){
  // header de datas está na linha 0, a partir da coluna 2
  const header = rows[0];
  const dates = [];
  for(let c=2;c<header.length;c++){
    const d=(header[c]||'').trim();
    if(d) dates.push({idx:c, label:d});
  }
  // Captura bloco GERAL: começa na linha com col0='GERAL' até próximo bloco (col0='META')
  let start=-1,end=rows.length;
  for(let r=0;r<rows.length;r++){
    if((rows[r][0]||'').trim()==='GERAL'){start=r;}
    else if((rows[r][0]||'').trim()==='META' && start>=0){end=r;break;}
  }
  const metrics={};
  for(let r=start;r<end;r++){
    const name=(rows[r][1]||'').trim();
    if(WANT.includes(name)){
      metrics[name]=dates.map(d=>num(rows[r][d.idx]));
    }
  }
  return {dates, metrics};
}

// converte "24/07/2026" -> Date
function brToDate(s){
  const [d,m,y]=s.split('/').map(Number);
  return new Date(y,m-1,d);
}

// ---------- Agregação por período ----------
function aggregate(startDate, endDate){
  const m=parsed.metrics, ds=parsed.dates;
  const sum={};
  WANT.forEach(k=>sum[k]=0);
  ds.forEach((d,i)=>{
    const dt=brToDate(d.label);
    if(dt>=startDate && dt<=endDate){
      WANT.forEach(k=>{ if(m[k]) sum[k]+=m[k][i]; });
    }
  });
  return sum;
}

// ---------- Benchmarks ----------
function classifyPvCheckout(p){ // PageView -> Checkout
  if(p<5) return 'red';
  if(p<=7) return 'greenlight';
  return 'greendeep';
}
function classifyCheckoutPayment(p){ // Checkout -> Payment Info
  if(p<40) return 'red';
  if(p<=50) return 'amber';
  return 'greenlight';
}
function classifyPaymentPurchase(p){ // Payment Info -> Purchase
  if(p<45) return 'red';
  if(p<=55) return 'amber';
  return 'greenlight';
}

// ---------- Render ----------
function fmtInt(n){return Math.round(n).toLocaleString('pt-BR');}
function fmtBRL(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
function pct(a,b){return b>0?(a/b*100):0;}

function render(){
  if(!parsed){document.getElementById('content').innerHTML='<div class="empty">Selecione um cliente.</div>';return;}
  const sd=brToDate(document.getElementById('dateStart').value.split('-').reverse().join('/'));
  const ed=brToDate(document.getElementById('dateEnd').value.split('-').reverse().join('/'));
  const s=aggregate(sd,ed);

  const invest=s['Investimento'], imp=s['Impressões'], clk=s['Cliques'],
        pv=s['PageView'], ic=s['Initiate Checkout'], pi=s['Payment Info'],
        pur=s['Purchase'], rev=s['Valor da conversão'];
  const roas=invest>0?rev/invest:0;
  const cac=pur>0?invest/pur:0;
  const ticket=pur>0?rev/pur:0;

  // transições
  const tImpClk=pct(clk,imp);       // neutro
  const tClkPv=pct(pv,clk);         // neutro
  const tPvIc=pct(ic,pv);           // PageView -> Checkout (benchmark)
  const tIcPi=pct(pi,ic);           // Checkout -> Payment Info (benchmark)
  const tPiPur=pct(pur,pi);         // Payment Info -> Purchase (benchmark)

  const kpis=`
    <div class="kpis">
      <div class="kpi"><div class="label">Investimento</div><div class="val">${fmtBRL(invest)}</div></div>
      <div class="kpi"><div class="label">Faturamento</div><div class="val green">${fmtBRL(rev)}</div></div>
      <div class="kpi"><div class="label">ROAS</div><div class="val ${roas>=3?'green':''}">${roas.toFixed(2)}</div></div>
      <div class="kpi"><div class="label">Vendas</div><div class="val">${fmtInt(pur)}</div></div>
      <div class="kpi"><div class="label">CAC</div><div class="val">${fmtBRL(cac)}</div></div>
      <div class="kpi"><div class="label">Ticket médio</div><div class="val">${fmtBRL(ticket)}</div></div>
    </div>`;

  function stage(name,val){return `<div class="stage-wrap"><div class="stage"><span class="name">${name}</span><span class="value">${fmtInt(val)}</span></div></div>`;}
  function brace(p,cls,label){
    return `<div class="connector"><div class="brace">
      <span class="curly">&#125;</span>
      <span class="pct ${cls}">${fmtPct(p)}</span>
      <span class="transition-label">${label}</span>
    </div></div>`;
  }

  const funnel=`
    <div class="section-title">Funil — jornada completa</div>
    <div class="funnel">
      ${stage('Impressões',imp)}
      ${brace(tImpClk,'neutral','Impr → Cliques')}
      ${stage('Cliques no link',clk)}
      ${brace(tClkPv,'neutral','Cliques → PageView')}
      ${stage('PageView',pv)}
      ${brace(tPvIc,classifyPvCheckout(tPvIc),'PageView → Checkout')}
      ${stage('Initiate Checkout',ic)}
      ${brace(tIcPi,classifyCheckoutPayment(tIcPi),'Checkout → Payment')}
      ${stage('Payment Info',pi)}
      ${brace(tPiPur,classifyPaymentPurchase(tPiPur),'Payment → Compra')}
      ${stage('Purchase',pur)}
    </div>`;

  const actions=buildActions({tPvIc,tIcPi,tPiPur,roas,cac,invest,pur});

  document.getElementById('content').innerHTML=kpis+funnel+actions;
}

function buildActions(d){
  const items=[];
  // PageView -> Checkout
  if(d.tPvIc<5){
    items.push(['crit','Gargalo crítico: PageView → Checkout ('+fmtPct(d.tPvIc)+')',
      'Menos de 5% de quem chega na LP inicia o checkout. A dor está na página: revise proposta de valor acima da dobra, prova social, clareza da oferta e velocidade de carregamento. Teste um CTA mais direto e reduza fricção até o botão de compra.']);
  }else if(d.tPvIc<=7){
    items.push(['warn','Atenção: PageView → Checkout ('+fmtPct(d.tPvIc)+')',
      'Está na média, mas há espaço. Teste variações de headline e posicionamento do CTA para empurrar acima de 7%.']);
  }else{
    items.push(['ok','Saudável: PageView → Checkout ('+fmtPct(d.tPvIc)+')',
      'A LP está convertendo bem em início de checkout. Mantenha e escale o tráfego que traz esse público.']);
  }
  // Checkout -> Payment Info
  if(d.tIcPi<40){
    items.push(['crit','Gargalo crítico: Checkout → Payment ('+fmtPct(d.tIcPi)+')',
      'Muita gente inicia o checkout e não chega a informar pagamento. Investigue campos demais no formulário, custo de frete aparecendo tarde, falta de meios de pagamento ou ausência de selos de segurança.']);
  }else if(d.tIcPi<=50){
    items.push(['warn','Atenção: Checkout → Payment ('+fmtPct(d.tIcPi)+')',
      'Conversão intermediária. Simplifique o checkout e teste exibir frete/prazo mais cedo para reduzir abandono.']);
  }else{
    items.push(['ok','Saudável: Checkout → Payment ('+fmtPct(d.tIcPi)+')',
      'Checkout fluindo bem até a etapa de pagamento.']);
  }
  // Payment Info -> Purchase
  if(d.tPiPur<45){
    items.push(['crit','Gargalo crítico: Payment → Compra ('+fmtPct(d.tPiPur)+')',
      'Cai muita venda na última etapa. Provável recusa de cartão, falta de Pix, ou erro no gateway. Ative recuperação (WhatsApp/e-mail de carrinho) e ofereça Pix como alternativa imediata.']);
  }else if(d.tPiPur<=55){
    items.push(['warn','Atenção: Payment → Compra ('+fmtPct(d.tPiPur)+')',
      'Perda aceitável mas melhorável. Reforce recuperação de checkout abandonado e revise taxa de aprovação do gateway.']);
  }else{
    items.push(['ok','Saudável: Payment → Compra ('+fmtPct(d.tPiPur)+')',
      'Fechamento forte na última etapa.']);
  }
  // ROAS
  if(d.roas<3 && d.invest>0){
    items.push(['warn','ROAS abaixo da meta ('+d.roas.toFixed(2)+' vs 3.0)',
      'O retorno está abaixo do alvo. Priorize corrigir o pior gargalo do funil acima antes de aumentar verba — subir investimento com funil furado só amplia a perda.']);
  }

  const rows=items.map(([tag,title,body])=>`
    <div class="action-item">
      <span class="tag ${tag}">${tag==='crit'?'CRÍTICO':tag==='warn'?'ATENÇÃO':'OK'}</span>
      <div class="body"><strong>${title}</strong><p>${body}</p></div>
    </div>`).join('');

  return `<div class="actions"><h2>Plano de ação</h2>
    <div class="sub">Sugestões priorizadas pelo gap da jornada no período selecionado.</div>
    ${rows}</div>`;
}

// ---------- Carregar cliente ----------
async function loadClient(c){
  current=c;
  document.getElementById('content').innerHTML='<div class="loading">Carregando dados…</div>';
  try{
    const resp=await fetch(c.url);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text=await resp.text();
    const rows=parseCSVText(text);
    parsed=buildParsed(rows);
    // definir datas padrão: últimos 30 dias com dado
    setLast30();
    render();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<div class="empty">Não foi possível ler a planilha.<br>'+
      'Se aparecer erro de CORS, é esperado ao abrir o arquivo local — '+
      'precisaremos da versão com servidor.<br><br><small>'+e.message+'</small></div>';
  }
}

function setLast30(){
  if(!parsed||!parsed.dates.length)return;
  // pega a última data com qualquer dado de investimento/impressão
  const ds=parsed.dates.map(d=>brToDate(d.label));
  const last=ds[ds.length-1];
  const first=new Date(last); first.setDate(first.getDate()-29);
  document.getElementById('dateEnd').value=toInput(last);
  document.getElementById('dateStart').value=toInput(first);
}
function toInput(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ---------- UI wiring ----------
function refreshClientSelect(){
  const sel=document.getElementById('clientSelect');
  sel.innerHTML=clients.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('');
}
document.getElementById('clientSelect').addEventListener('change',e=>{
  loadClient(clients[+e.target.value]);
});
document.getElementById('applyDates').addEventListener('click',render);
document.getElementById('last30').addEventListener('click',()=>{setLast30();render();});
document.getElementById('addClientBtn').addEventListener('click',()=>document.getElementById('modalBg').classList.add('open'));
document.getElementById('cancelAdd').addEventListener('click',()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('saveClient').addEventListener('click',()=>{
  const name=document.getElementById('newName').value.trim();
  const url=document.getElementById('newUrl').value.trim();
  if(!name||!url){alert('Preencha nome e link.');return;}
  clients.push({name,url});saveClients();refreshClientSelect();
  document.getElementById('newName').value='';document.getElementById('newUrl').value='';
  document.getElementById('modalBg').classList.remove('open');
  document.getElementById('clientSelect').value=clients.length-1;
  loadClient(clients[clients.length-1]);
});

// init
refreshClientSelect();
if(clients.length){document.getElementById('clientSelect').value=0;loadClient(clients[0]);}
</script>
</body>
</html>
